name: Copilot CLI runtime verification

on:
  push:
    branches:
      - copilot-runtime-verify-20261105
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Pack and inspect Linux x64 runtimes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspect

          inspect_version() {
            version="$1"
            out="inspect/$version"
            mkdir -p "$out"
            pushd "$out" >/dev/null

            npm pack "@github/copilot-linux-x64@$version" --json > npm-pack.json
            pkg="$(node -e "const x=require('./npm-pack.json'); console.log(x[0].filename)")"
            sha256sum "$pkg" > package-sha256.txt
            mkdir package
            tar -xzf "$pkg" -C package --strip-components=1
            rm -f "$pkg"

            node -e "const p=require('./package/package.json'); console.log(JSON.stringify(p,null,2))" > package-json-normalized.txt
            find package -type f -printf '%s\t%p\n' | sort -n > tree.txt
            find package -type f -print0 | xargs -0 file > filetypes.txt
            find package -type f -executable -printf '%p\n' > executables.txt
            while IFS= read -r f; do sha256sum "$f"; done < executables.txt > executable-sha256.txt

            : > strings-filtered.txt
            while IFS= read -r -d '' f; do
              size=$(stat -c %s "$f")
              if [ "$size" -le 300000000 ]; then
                LC_ALL=C strings -a "$f" |
                  grep -E -i 'serverName|toolName|permission|approval|custom-tool|extension-management|kind.{0,30}mcp|kind.{0,30}shell|mcp.{0,80}shell|shell.{0,80}mcp|permission.*rule|rule.*permission' |
                  head -n 100000 >> strings-filtered.txt || true
              fi
            done < <(find package -type f -print0)

            grep -a -n -E -i -C 6 'serverName|toolName|kind.{0,30}mcp|kind.{0,30}shell|mcp.{0,80}shell|shell.{0,80}mcp' strings-filtered.txt > strings-context.txt || true

            exe="$(head -n 1 executables.txt || true)"
            if [ -n "$exe" ]; then
              "$exe" --version > runtime-version.txt 2>&1 || true
              "$exe" --help > runtime-help.txt 2>&1 || true
            fi
            popd >/dev/null
          }

          inspect_version '1.0.74'
          inspect_version '1.0.106-9'

          diff -u inspect/1.0.74/package-json-normalized.txt inspect/1.0.106-9/package-json-normalized.txt > inspect/package-json.diff || true
          diff -u inspect/1.0.74/strings-context.txt inspect/1.0.106-9/strings-context.txt > inspect/strings-context.diff || true

          echo '=== 1.0.74 tree ==='
          cat inspect/1.0.74/tree.txt
          echo '=== 1.0.106-9 tree ==='
          cat inspect/1.0.106-9/tree.txt
          echo '=== 1.0.74 runtime ==='
          cat inspect/1.0.74/runtime-version.txt || true
          echo '=== 1.0.106-9 runtime ==='
          cat inspect/1.0.106-9/runtime-version.txt || true
          echo '=== relevant strings diff ==='
          head -n 4000 inspect/strings-context.diff || true

      - name: Upload inspection text
        uses: actions/upload-artifact@v4
        with:
          name: copilot-runtime-inspection
          path: |
            inspect/**/npm-pack.json
            inspect/**/package-sha256.txt
            inspect/**/package-json-normalized.txt
            inspect/**/tree.txt
            inspect/**/filetypes.txt
            inspect/**/executables.txt
            inspect/**/executable-sha256.txt
            inspect/**/runtime-version.txt
            inspect/**/runtime-help.txt
            inspect/**/strings-filtered.txt
            inspect/**/strings-context.txt
            inspect/*.diff
          if-no-files-found: error
          retention-days: 1

      - name: Upload vulnerable runtime
        uses: actions/upload-artifact@v4
        with:
          name: copilot-linux-x64-1.0.74
          path: inspect/1.0.74/package
          compression-level: 0
          retention-days: 1

      - name: Upload current runtime
        uses: actions/upload-artifact@v4
        with:
          name: copilot-linux-x64-1.0.106-9
          path: inspect/1.0.106-9/package
          compression-level: 0
          retention-days: 1
